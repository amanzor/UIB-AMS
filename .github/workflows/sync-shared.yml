name: Sync shared files from the Binder Book

# The AMS and the Binder Book share the files in shared-files.txt. If they
# drift, the two apps write the same Supabase row by different rules —
# which is exactly how a book of business gets overwritten. This watches
# for that and opens a pull request rather than letting it go unnoticed.
#
# Runs on a schedule, and on demand from the Actions tab.

on:
  schedule:
    - cron: '17 * * * *'   # hourly, so uib-ams.vercel.app never falls behind the Binder Book's /ams
  workflow_dispatch:
  push:
    paths:
      - 'shared-files.txt'
      - 'app-files.txt'
      - 'scripts/sync-shared.sh'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the AMS
        uses: actions/checkout@v4

      - name: Check out the Binder Book
        uses: actions/checkout@v4
        with:
          repository: amanzor/uib-binderbook
          path: .binderbook
          ref: master

      - name: Copy the shared files
        id: copy
        run: |
          chmod +x scripts/sync-shared.sh
          scripts/sync-shared.sh .binderbook
          rm -rf .binderbook
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "files<<EOF" >> "$GITHUB_OUTPUT"
            git status --porcelain | sed 's/^ *M */  - /' >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit straight to main
        if: steps.copy.outputs.changed == 'true'
        # The files are copied verbatim from the Binder Book, where they were
        # already reviewed and merged, so they go live here without a second
        # pull request to merge. Vercel deploys uib-ams.vercel.app from main.
        run: |
          git config user.name  "uib-sync-bot"
          git config user.email "uib-sync-bot@users.noreply.github.com"
          git add -A
          git commit -m "Sync shared files from the Binder Book" -m "${{ steps.copy.outputs.files }}"
          git push origin HEAD:main
